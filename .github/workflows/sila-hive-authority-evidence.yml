name: Sila Hive authority evidence

on:
  push:
    branches:
      - sila/hive-latest-pure-20260922
  pull_request:
    branches:
      - main

jobs:
  calltree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: true
      - name: Generate canonical calltree bytecode
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          echo "GO_MOD_TIDY_DIFF_BEGIN"
          git diff -- go.mod go.sum || true
          echo "GO_MOD_TIDY_DIFF_END"
          cd cmd/hivechain
          go tool geas -a -bin -o /tmp/calltree.bin contracts/calltree.eas
          size=$(wc -c < /tmp/calltree.bin)
          {
            printf 'blob %s\0' "$size"
            cat /tmp/calltree.bin
          } | sha1sum | awk '{print "GIT_BLOB_SHA=" $1}'
          sha256sum /tmp/calltree.bin
          echo "CALLTREE_BASE64=$(base64 -w0 /tmp/calltree.bin)"
